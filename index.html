<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Secure Payment Page</title> <style> body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; margin: 0; padding: 0; color: #333; } header { background: #0077cc; color: white; padding: 20px; text-align: center; } .container { max-width: 700px; margin: 40px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); } .logo-row { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; } .logo-row img { width: 100px; height: 40px; object-fit: contain; } .form-group { margin-bottom: 20px; } label { display: block; margin-bottom: 8px; font-weight: bold; } input[type="text"], input[type="email"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; } button { background-color: #0077cc; color: white; padding: 12px 20px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; width: 100%; } button:hover { background-color: #005fa3; } .tracking { margin-top: 20px; font-size: 14px; color: #555; } .photo-preview { margin-top: 15px; text-align: center; } .photo-preview img { max-width: 100%; height: auto; border: 1px solid #ccc; border-radius: 5px; } </style> </head> <body> <header> <h1>Secure Payment Page</h1> <p>Trustworthy & Verified</p> </header> <div class="container"> <div class="logo-row"> <img src="https://upload.wikimedia.org/wikipedia/commons/1/1a/PayPal_logo.png" alt="PayPal" /> <img src="https://upload.wikimedia.org/wikipedia/commons/0/0c/Stripe_Logo.png" alt="Stripe" /> <img src="https://upload.wikimedia.org/wikipedia/commons/2/21/Visa_Logo.png" alt="Visa" /> <img src="https://upload.wikimedia.org/wikipedia/commons/0/02/Mastercard_Logo.png" alt="MasterCard" /> </div> <form id="paymentForm"> <div class="form-group"> <label for="name">Full Name</label> <input type="text" id="name" name="name" required /> </div> <div class="form-group"> <label for="email">Email Address</label> <input type="email" id="email" name="email" required /> </div> <div class="form-group"> <label for="photo">Upload Photo (for verification)</label> <input type="file" id="photo" name="photo" accept="image/*" required /> </div> <div class="form-group"> <label for="amount">Payment Amount</label> <input type="text" id="amount" name="amount" placeholder="$100.00" required /> </div> <button type="submit">Complete Payment</button> </form> <div class="tracking" id="tracking"> <p>Real-time location tracking: <span id="location">Loading...</span></p> </div> <div class="photo-preview" id="photoPreview"> <img src="" alt="Uploaded Photo" id="previewImage" style="display: none;" /> </div> </div> <script> // Real-time location tracking if (navigator.geolocation) { navigator.geolocation.getCurrentPosition( (position) => { const lat = position.coords.latitude; const lng = position.coords.longitude; document.getElementById("location").textContent = `Latitude: ${lat}, Longitude: ${lng}`; }, (error) => { document.getElementById("location").textContent = "Location could not be retrieved."; } ); } // Photo upload preview const photoInput = document.getElementById("photo"); const previewImage = document.getElementById("previewImage"); photoInput.addEventListener("change", function () { const file = this.files[0]; if (file) { const reader = new FileReader(); reader.onload = function (e) { previewImage.src = e.target.result; previewImage.style.display = "block"; }; reader.readAsDataURL(file); } }); // Form submission document.getElementById("paymentForm").addEventListener("submit", function (e) { e.preventDefault(); alert("Payment submitted successfully!"); // You can replace this with actual payment processing logic }); </script> </body> </html>
